name: Research Assistant CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          OPENROUTER_API_KEY: test-placeholder
          OPENROUTER_MODEL_ID: test-model
          TAVILY_API_KEY: test-placeholder
        run: pytest -q
      - name: Build Docker image
        run: docker build -t research-assistant:${{ github.sha }} .